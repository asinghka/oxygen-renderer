[package]
name = "oxygen"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.0"
egui = "0.35.0"
egui-wgpu = "0.35.0"
glam = "0.33.2"
gltf = "1.4.1"
re_ui = "0.34.1"
wgpu = "29.0.3"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.35.0"
env_logger = "0.11.11"
pollster = "0.4.0"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# egui-winit's default "clipboard" feature pulls in arboard, which has no wasm backend.
egui-winit = { version = "0.35.0", default-features = false }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
# Pulled in transitively by the rerun stack; needs its wasm backend opted in,
# which also requires the rustflag in .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# std::time::Instant panics on wasm32-unknown-unknown.
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["Document", "Element", "HtmlCanvasElement", "Response", "Window"]
